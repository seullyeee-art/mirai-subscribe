<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MIRAI 구독 · MAX</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css');

  /* ── 리셋 + 베이스 (shared 인라인 — 배포 self-contained) ── */
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    font-family:'Pretendard JP','Pretendard Variable JP',-apple-system,BlinkMacSystemFont,sans-serif;
    font-feature-settings:'ss10' 1;
    background:var(--bg-normal); color:var(--label-normal);
    min-height:100dvh; -webkit-font-smoothing:antialiased; letter-spacing:0.0057em;
  }
  img,svg{ display:block; max-width:100%; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  a{ color:inherit; text-decoration:none; }

  /* ── MIRAI 디자인 토큰 (shared/styles.css 인라인) + 페이지 헬퍼 ── */
  :root{
    --primary-normal:#14C391; --primary-strong:#14C092; --primary-heavy:#13BB8F;
    --label-normal:#F7F7F8; --label-strong:#FFFFFF;
    --label-neutral:rgba(194,196,200,0.88); --label-alternative:rgba(174,176,182,0.61);
    --label-assistive:rgba(174,176,182,0.28); --label-disable:rgba(152,155,162,0.16);
    --bg-normal:#1B1C1E; --bg-alternative:#0F0F10; --bg-elevated:#1B1C1E;
    --line-normal:rgba(112,115,124,0.32); --line-neutral:rgba(112,115,124,0.28); --line-alternative:rgba(112,115,124,0.22);
    --line-solid-normal:#37383C; --line-solid-neutral:#333438; --line-solid-alternative:#2E2F33;
    --fill-normal:rgba(112,115,124,0.22); --fill-strong:rgba(112,115,124,0.28); --fill-alternative:rgba(112,115,124,0.12);
    --status-positive:#1DD45A; --status-cautionary:#FFA938; --status-negative:#FF6363;
    --accent-red-orange:#FF7B2E; --accent-cyan:#28D0ED;
    --accent-violet:#7C5EF7; --accent-pink:#FA73E3; --accent-purple:#D478FF; --accent-light-blue:#3DC2FF; --accent-lime:#6BE016;
    /* 페이지 헬퍼 */
    --primary-rgb:20,195,145;
    --bg-rgb:27,28,30;
    --max-gold:#F6C66B;      /* max.png 골드 에셋 매칭 — 데코 스파클 전용 */
    --max-amber:#F4B23E;     /* MAX 뱃지 그라데이션 (amber→orange) */
  }

  body{ overflow-x:hidden; }

  /* ═══ PARTICLES (은은한 배경 입자) ═══ */
  .particles{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .particle{ position:absolute; border-radius:50%; animation:float linear infinite; }
  @keyframes float{
    0%{ transform:translateY(110vh) scale(0); opacity:0; }
    15%{ opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translateY(-10vh) scale(1); opacity:0; }
  }

  /* ═══ FRAME (구독 = 집중형 단일 컬럼) ═══ */
  .frame{
    position:relative; z-index:1;
    width:100%; max-width:600px;
    margin:0 auto;
    min-height:100dvh;
    padding-bottom:140px;          /* 모바일 sticky CTA 여백 */
  }

  /* ═══ HERO ═══ */
  .hero{
    position:relative; overflow:hidden;
    min-height:194px;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .hero-bg{
    position:absolute; inset:0;
    background:url('images/hero-ko.webp') no-repeat center top;
    background-size:cover;
    opacity:0.55;
    transform:scale(1.02);
  }
  .hero-glow{
    position:absolute; inset:0; pointer-events:none;
    mix-blend-mode:screen;
    background:
      radial-gradient(ellipse 420px 280px at 50% 30%, rgba(var(--primary-rgb),0.35) 0%, transparent 62%),
      radial-gradient(ellipse 300px 240px at 78% 64%, rgba(var(--primary-rgb),0.18) 0%, transparent 60%),
      radial-gradient(ellipse 240px 200px at 18% 70%, rgba(40,208,237,0.10) 0%, transparent 60%);
  }
  .hero-fade{
    position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(var(--bg-rgb),0.55) 0%, rgba(var(--bg-rgb),0) 22%, rgba(var(--bg-rgb),0) 46%, rgba(var(--bg-rgb),0.78) 82%, var(--bg-normal) 100%);
  }
  .hero-top{
    position:absolute; top:0; left:0; right:0; z-index:3;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 0;
  }
  /* KO/EN 토글 (개발자 확인용) */
  .lang-toggle{
    display:inline-flex; gap:2px; padding:3px;
    border-radius:999px;
    background:rgba(var(--bg-rgb),0.45);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .lang-seg{
    padding:5px 12px; border-radius:999px;
    font-family:inherit; font-size:12px; font-weight:700; line-height:1;
    color:var(--label-alternative);
    transition:background 0.15s ease, color 0.15s ease;
  }
  .lang-seg.active{ background:var(--primary-normal); color:#fff; }
  .icon-close{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--label-strong);
    background:rgba(var(--bg-rgb),0.4);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .icon-close:active{ transform:scale(0.9); }

  .hero-copy{
    position:relative; z-index:2;
    text-align:center;
    padding:0 24px 30px;
  }
  .hero-title{
    font-size:34px; font-weight:800; letter-spacing:-0.03em; line-height:1.12;
    color:var(--label-strong);
    text-shadow:0 2px 24px rgba(var(--bg-rgb),0.6);
  }
  .hero-title .num{
    display:block;
    font-size:44px; font-weight:900;
    background:linear-gradient(120deg, #7CFFDD 0%, #34EAB6 45%, #5FE6FF 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-sub{
    margin:12px auto 0; max-width:330px;
    font-size:13px; font-weight:500; line-height:1.55;
    color:var(--label-neutral);
    text-shadow:0 1px 12px rgba(var(--bg-rgb),0.7);
    word-break:keep-all; text-wrap:balance;
  }

  /* ═══ PLAN CARD (MAX) ═══ */
  .plan{
    margin:4px 16px 0; padding:16px 20px 20px;
    border-radius:24px; position:relative; overflow:hidden;
    background:
      radial-gradient(ellipse 220px 150px at 100% 0%, rgba(var(--primary-rgb),0.14) 0%, transparent 70%),
      radial-gradient(ellipse 180px 130px at 0% 100%, rgba(40,208,237,0.07) 0%, transparent 70%),
      linear-gradient(155deg, rgba(112,115,124,0.12), rgba(112,115,124,0.04));
    border:1px solid rgba(var(--primary-rgb),0.20);
  }

  /* ═══ 무료 vs MAX 비교표 (비인터랙티브 — 혜택 강조용) ═══ */
  .cmp-h.cmp-h-label{ text-align:left; font-weight:400; color:var(--label-alternative); }
  .cmp{
    position:relative; z-index:2;
    display:grid; grid-template-columns:1fr 48px 56px; column-gap:8px;
    align-items:center; margin-top:2px;
  }
  /* MAX 컬럼 하이라이트 배경 */
  .cmp-maxbg{
    position:absolute; top:-10px; bottom:-2px; right:-4px; width:64px;
    background:linear-gradient(180deg, rgba(var(--primary-rgb),0.18), rgba(var(--primary-rgb),0.06));
    border-radius:14px; z-index:0; pointer-events:none;
  }
  .cmp-h{ font-size:13px; font-weight:500; text-align:center; padding-bottom:12px; position:relative; z-index:1; letter-spacing:0.01em; }
  .cmp-h.cmp-free{ font-size:15px; color:var(--label-neutral); }
  .cmp-h.cmp-max{ color:var(--primary-normal); }
  .cmp-label{
    display:flex; align-items:center; gap:10px;
    font-size:14px; font-weight:600; letter-spacing:-0.01em; line-height:1.25;
    color:var(--label-normal); padding:14px 8px 14px 0;
  }
  .cmp-ic{ display:none; }
  .cmp-cell{ display:flex; align-items:center; justify-content:center; padding:14px 0; position:relative; z-index:1; }
  .cmp-cell svg{ width:18px; height:18px; }
  .cmp-free svg{ color:var(--label-alternative); }
  .cmp-max svg{ stroke:url(#maxGrad); }
  .cmp-dash{ display:inline-block; width:12px; height:2px; border-radius:2px; background:var(--label-assistive); }
  /* MAX 뱃지 (듀오링고 SUPER 스타일 — 골드 그라데이션 필) */
  .max-badge{
    display:inline-flex; align-items:center; justify-content:center;
    padding:3px 10px; border-radius:8px;
    font-size:13px; font-weight:900; font-style:italic; letter-spacing:0.04em;
    color:#fff;
    background:linear-gradient(115deg, #2EE6B0 0%, #56C2FF 48%, #4DED9A 100%);
    box-shadow:0 3px 12px rgba(40,200,170,0.45);
    text-shadow:0 1px 3px rgba(0,28,20,0.85);
  }

  /* ═══ PRICING OPTIONS (연간 / 월간) ═══ */
  .opts{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    margin:18px 16px 0;
  }
  .opt{
    position:relative; text-align:left;
    padding:18px 16px 16px; border-radius:16px;
    background:linear-gradient(160deg, rgba(112,115,124,0.10), rgba(112,115,124,0.03));
    border:1.5px solid var(--line-solid-neutral);
    cursor:pointer; transition:border-color 0.18s ease, background 0.18s ease, transform 0.1s ease;
    display:flex; flex-direction:column; gap:6px;
  }
  .opt:active{ transform:scale(0.985); }
  .opt.selected{
    border-color:var(--primary-normal);
    background:
      radial-gradient(ellipse 160px 120px at 50% 0%, rgba(var(--primary-rgb),0.14) 0%, transparent 70%),
      linear-gradient(160deg, rgba(var(--primary-rgb),0.08), rgba(var(--primary-rgb),0.02));
    box-shadow:0 0 0 3px rgba(var(--primary-rgb),0.12);
  }
  .opt-ribbon{
    position:absolute; top:-9px; left:14px;
    display:inline-flex; align-items:center; gap:3px;
    padding:3px 9px; border-radius:999px;
    font-size:10px; font-weight:800; letter-spacing:0.01em; color:#fff;
    background:linear-gradient(135deg, var(--accent-red-orange), var(--status-negative));
    box-shadow:0 3px 10px rgba(255,99,99,0.35);
  }
  .opt-period{ font-size:14px; font-weight:700; color:var(--label-strong); }
  .opt-priceline{ display:flex; align-items:baseline; gap:6px; }
  .opt-price{ font-size:24px; font-weight:900; letter-spacing:-0.03em; color:var(--label-strong); }
  .opt-price small{ font-size:13px; font-weight:600; color:var(--label-neutral); }
  .opt-orig{ font-size:12px; font-weight:600; color:var(--label-alternative); text-decoration:line-through; }
  .opt-orig.hide{ visibility:hidden; }
  .opt-tick{
    position:absolute; top:14px; right:14px;
    width:20px; height:20px; border-radius:50%;
    border:1.5px solid var(--line-solid-normal);
    display:flex; align-items:center; justify-content:center;
    color:transparent; transition:all 0.15s ease;
  }
  .opt.selected .opt-tick{ background:var(--primary-normal); border-color:var(--primary-normal); color:#fff; }
  .opt-tick svg{ width:12px; height:12px; }

  /* ═══ CTA BAR ═══ */
  .cta-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:120;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(var(--bg-rgb),0.94);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line-alternative);
  }
  /* 위쪽 콘텐츠가 바 안으로 부드럽게 페이드 */
  .cta-bar::before{
    content:''; position:absolute; left:0; right:0; top:-24px; height:24px;
    background:linear-gradient(180deg, rgba(var(--bg-rgb),0), rgba(var(--bg-rgb),0.94));
    pointer-events:none;
  }
  .cta-inner{ max-width:600px; margin:0 auto; }
  .cta{
    width:100%; height:48px; border-radius:12px;
    background:linear-gradient(116deg, var(--primary-normal), var(--primary-heavy));
    color:var(--label-strong);
    font-size:16px; font-weight:600; letter-spacing:-0.02em;
    box-shadow:0 8px 24px rgba(var(--primary-rgb),0.32);
    transition:transform 0.12s ease, filter 0.15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .cta:hover{ filter:brightness(1.04); }
  .cta:active{ transform:scale(0.985); }
  .cta-note{ margin-top:8px; text-align:center; font-size:11px; font-weight:500; color:var(--label-alternative); }

  /* ═══ TOAST ═══ */
  .toast{
    position:fixed; top:-60px; left:50%; transform:translateX(-50%);
    padding:12px 24px; border-radius:999px;
    background:rgba(var(--bg-rgb),0.75);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    color:var(--label-strong); font-size:14px; font-weight:700;
    white-space:nowrap; z-index:9999;
    transition:top 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toast.show{ top:64px; }

  /* ═══ ENTRANCE ═══ */
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }
  .ai{ animation:fadeUp 0.45s ease-out both; }
  .d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}

  /* ═══ DESKTOP (≥769px) ═══ */
  @media (min-width:769px){
    .frame{ max-width:560px; padding-bottom:24px; padding-top:0; }
    .hero{ min-height:168px; border-radius:0 0 24px 24px; }
    .hero-title{ font-size:36px; } .hero-title .num{ font-size:48px; }
    .hero-sub{ font-size:14px; max-width:380px; }
    .plan{ margin:12px 0 0; padding:14px 24px 18px; }
    .cmp-label{ font-size:15px; }
    .opts{ margin:14px 0 0; }

    /* CTA: 데스크탑은 흐름 안에서 인라인 */
    .cta-bar{
      position:static; padding:0; margin:16px 0 0;
      background:none; backdrop-filter:none; -webkit-backdrop-filter:none; border-top:none;
    }
    .cta-bar::before{ display:none; }
    .cta-inner{ max-width:none; }
  }
</style>
</head>
<body>

<!-- 공용 그라데이션 def (MAX 체크 stroke·아이콘용) — accent 토큰 매칭 -->
<svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true"><defs>
  <linearGradient id="maxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#2EE6B0"/><stop offset="50%" stop-color="#56C2FF"/><stop offset="100%" stop-color="#4DED9A"/>
  </linearGradient>
</defs></svg>

<div class="particles" id="pts"></div>

  <main class="frame">

    <!-- ═══ HERO ═══ -->
    <section class="hero">
      <div class="hero-bg"></div>
      <div class="hero-glow"></div>
      <div class="hero-fade"></div>

      <div class="hero-top">
        <div class="lang-toggle">
          <button class="lang-seg active" data-lang="ko" onclick="setLang('ko')">KO</button>
          <button class="lang-seg" data-lang="en" onclick="setLang('en')">EN</button>
        </div>
        <button class="icon-close" aria-label="닫기" onclick="history.back()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="hero-copy ai d1">
        <h1 class="hero-title"><span class="num">100,000+</span><span data-ko="인기 캐릭터" data-en="Popular Characters">인기 캐릭터</span></h1>
        <p class="hero-sub" data-ko="무제한 대화에 참여하고, 깊이 있게 탐험해 보세요." data-en="Join unlimited conversations and explore deeper.">무제한 대화에 참여하고, 깊이 있게 탐험해 보세요.</p>
      </div>
    </section>

    <!-- ═══ MAX PLAN ═══ -->
    <section class="plan ai d2">

      <div class="cmp">
        <span class="cmp-maxbg"></span>

        <span class="cmp-h cmp-h-label" data-ko="혜택 비교" data-en="Compare benefits">혜택 비교</span>
        <span class="cmp-h cmp-free" data-ko="무료" data-en="Free">무료</span>
        <span class="cmp-h cmp-max"><span class="max-badge">MAX</span></span>

        <span class="cmp-label"><span class="cmp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M9 16l2 2 4-4"/></svg></span><span data-ko="일일 출석 보상" data-en="Daily Check-in Reward">일일 출석 보상</span></span>
        <span class="cmp-cell cmp-free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span class="cmp-cell cmp-max"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>

        <span class="cmp-label"><span class="cmp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88"/></svg></span><span data-ko="10만+ 캐릭터 탐색" data-en="Explore 100,000+ Characters">10만+ 캐릭터 탐색</span></span>
        <span class="cmp-cell cmp-free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
        <span class="cmp-cell cmp-max"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>

        <span class="cmp-label"><span class="cmp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span><span data-ko="무제한 대화 (성능 최적화)" data-en="Unlimited Chat (Performance Optimized)">무제한 대화 (성능 최적화)</span></span>
        <span class="cmp-cell cmp-free"><span class="cmp-dash"></span></span>
        <span class="cmp-cell cmp-max"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>

        <span class="cmp-label"><span class="cmp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg></span><span data-ko="대화를 더 오래 기억 (+100턴)" data-en="Remembers More (+100 turns)">대화를 더 오래 기억 (+100턴)</span></span>
        <span class="cmp-cell cmp-free"><span class="cmp-dash"></span></span>
        <span class="cmp-cell cmp-max"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>

        <span class="cmp-label"><span class="cmp-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></span><span data-ko="입력 길이 2배" data-en="2× Input Length">입력 길이 2배</span></span>
        <span class="cmp-cell cmp-free"><span class="cmp-dash"></span></span>
        <span class="cmp-cell cmp-max"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>

<script>
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);

  /* ── 입자 ── */
  (function(){
    const pc = document.getElementById('pts');
    const colors = ['20,195,145','95,255,207','40,208,237'];
    for (let i = 0; i < 14; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const s = Math.random() * 3 + 2;
      const c = colors[Math.floor(Math.random()*colors.length)];
      p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;`
        + `background:rgba(${c},0.7);box-shadow:0 0 ${s*3}px rgba(${c},0.4);`
        + `animation-duration:${Math.random()*10+10}s;animation-delay:${Math.random()*8}s`;
      pc.appendChild(p);
    }
  })();

  /* ── 다국어 (개발자 확인용 KO/EN 토글) ── */
  const I18N = {
    ko: {
      cta:  { annual:'월 $30.00 구독하기', monthly:'월 $39.99 구독하기' },
      note: '매월 자동 갱신 · 언제든 취소 가능',
      toast:{ annual:'MAX 연간 (연 $360) 구독 — 결제 연동 예정', monthly:'MAX 월간 (월 $39.99) 구독 — 결제 연동 예정' }
    },
    en: {
      cta:  { annual:'Subscribe · $30.00/mo', monthly:'Subscribe · $39.99/mo' },
      note: 'Auto-renews monthly · Cancel anytime',
      toast:{ annual:'MAX Annual ($360/yr) — payment integration pending', monthly:'MAX Monthly ($39.99/mo) — payment integration pending' }
    }
  };
  let lang = 'ko';
  let current = 'annual';

  function setLang(l){
    lang = l;
    document.documentElement.lang = l;
    document.querySelectorAll('[data-ko]').forEach(el => { el.textContent = el.dataset[l]; });
    document.querySelector('.hero-bg').style.backgroundImage = `url('images/hero-${l}.webp')`;
    document.querySelectorAll('.lang-seg').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
    selectPlan(current);  // CTA·안내문 언어 반영
  }

  function selectPlan(period){
    current = period;
    document.querySelectorAll('.opt').forEach(o => {
      o.classList.toggle('selected', o.dataset.period === period);
    });
    document.getElementById('ctaBtn').textContent = I18N[lang].cta[period];
    document.getElementById('ctaNote').textContent = I18N[lang].note;
  }

  function subscribe(){
    showToast(I18N[lang].toast[current]);
  }

  setLang('ko');  // 초기화

  /* ── 토스트 ── */
  function showToast(msg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2500);
  }
</script>

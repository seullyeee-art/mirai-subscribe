<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MIRAI 구독 · MAX</title>
<link rel="stylesheet" href="../shared/styles.css">
<style>
  /* 페이지 헬퍼 — primary(#14C391) 글로우용 rgb 튜플 (shared 토큰 파생) */
  :root{
    --primary-rgb:20,195,145;
    --bg-rgb:27,28,30;
    --max-gold:#F6C66B;      /* max.png 골드 에셋 매칭 — 데코 스파클 전용 */
  }

  body{ overflow-x:hidden; }

  /* ═══ PARTICLES (은은한 배경 입자) ═══ */
  .particles{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .particle{ position:absolute; border-radius:50%; animation:float linear infinite; }
  @keyframes float{
    0%{ transform:translateY(110vh) scale(0); opacity:0; }
    15%{ opacity:1; }
    85%{ opacity:1; }
    100%{ transform:translateY(-10vh) scale(1); opacity:0; }
  }

  /* ═══ FRAME (구독 = 집중형 단일 컬럼) ═══ */
  .frame{
    position:relative; z-index:1;
    width:100%; max-width:600px;
    margin:0 auto;
    min-height:100dvh;
    padding-bottom:140px;          /* 모바일 sticky CTA 여백 */
  }

  /* ═══ HERO ═══ */
  .hero{
    position:relative; overflow:hidden;
    min-height:210px;
    display:flex; flex-direction:column; justify-content:flex-end;
  }
  .hero-bg{
    position:absolute; inset:0;
    background:url('../mirai-home/images/char-full.webp') no-repeat center 14%;
    background-size:cover;
    opacity:0.55;
    transform:scale(1.02);
  }
  .hero-glow{
    position:absolute; inset:0; pointer-events:none;
    mix-blend-mode:screen;
    background:
      radial-gradient(ellipse 420px 280px at 50% 30%, rgba(var(--primary-rgb),0.35) 0%, transparent 62%),
      radial-gradient(ellipse 300px 240px at 78% 64%, rgba(var(--primary-rgb),0.18) 0%, transparent 60%),
      radial-gradient(ellipse 240px 200px at 18% 70%, rgba(40,208,237,0.10) 0%, transparent 60%);
  }
  .hero-fade{
    position:absolute; inset:0; pointer-events:none;
    background:
      linear-gradient(180deg, rgba(var(--bg-rgb),0.55) 0%, rgba(var(--bg-rgb),0) 22%, rgba(var(--bg-rgb),0) 46%, rgba(var(--bg-rgb),0.78) 82%, var(--bg-normal) 100%);
  }
  .hero-top{
    position:absolute; top:0; left:0; right:0; z-index:3;
    display:flex; align-items:center; justify-content:flex-end;
    padding:14px 16px 0;
  }
  .icon-close{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:var(--label-strong);
    background:rgba(var(--bg-rgb),0.4);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    transition:transform 0.15s ease, background 0.15s ease;
  }
  .icon-close:active{ transform:scale(0.9); }

  .hero-copy{
    position:relative; z-index:2;
    text-align:center;
    padding:0 24px 22px;
  }
  .hero-title{
    font-size:34px; font-weight:800; letter-spacing:-0.03em; line-height:1.12;
    color:var(--label-strong);
    text-shadow:0 2px 24px rgba(var(--bg-rgb),0.6);
  }
  .hero-title .num{
    display:block;
    font-size:44px; font-weight:900;
    background:linear-gradient(135deg, #5fffcf, var(--primary-normal));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-sub{
    margin:12px auto 0; max-width:330px;
    font-size:13px; font-weight:500; line-height:1.55;
    color:var(--label-neutral);
    text-shadow:0 1px 12px rgba(var(--bg-rgb),0.7);
    word-break:keep-all; text-wrap:balance;
  }

  /* ═══ PLAN CARD (MAX) ═══ */
  .plan{
    margin:4px 16px 0; padding:24px 20px 20px;
    border-radius:24px; position:relative; overflow:hidden;
    background:
      radial-gradient(ellipse 220px 150px at 100% 0%, rgba(var(--primary-rgb),0.14) 0%, transparent 70%),
      radial-gradient(ellipse 180px 130px at 0% 100%, rgba(40,208,237,0.07) 0%, transparent 70%),
      linear-gradient(155deg, rgba(112,115,124,0.12), rgba(112,115,124,0.04));
    border:1px solid rgba(var(--primary-rgb),0.20);
  }
  .plan-head{
    display:flex; align-items:center; gap:10px;
    position:relative; z-index:2;
  }
  .plan-badge{ width:46px; height:32px; object-fit:contain; flex-shrink:0;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.4)); }
  .plan-name{
    font-size:24px; font-weight:900; letter-spacing:-0.02em;
    color:var(--label-strong);
  }
  .plan-tag{
    margin:8px 0 18px;
    font-size:13px; font-weight:500; color:var(--label-alternative);
    position:relative; z-index:2;
  }

  /* sparkles (광택감) — MAX 골드 에셋 매칭 */
  .sparkle{
    position:absolute; width:4px; height:4px; border-radius:50%;
    background:var(--max-gold);
    box-shadow:0 0 6px var(--max-gold), 0 0 12px rgba(246,198,107,0.4);
    animation:sparkle 2.2s ease-in-out infinite; pointer-events:none; z-index:2;
  }
  @keyframes sparkle{ 0%,100%{ opacity:0; transform:scale(0.5);} 50%{ opacity:1; transform:scale(1.2);} }

  .features{ list-style:none; display:flex; flex-direction:column; gap:13px; position:relative; z-index:2; }
  .feat{ display:flex; align-items:center; gap:12px; }
  .feat-icon{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    color:var(--primary-normal);
    background:rgba(var(--primary-rgb),0.10);
    border:1px solid rgba(var(--primary-rgb),0.18);
  }
  .feat-icon svg{ width:17px; height:17px; }
  .feat-text{ flex:1; font-size:14px; font-weight:600; letter-spacing:-0.01em; color:var(--label-normal); }
  .feat-stat{ width:22px; height:22px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .feat-stat svg{ width:20px; height:20px; }
  .stat-up{ color:var(--primary-normal); }     /* 무료 대비 강화 */
  .stat-check{ color:var(--primary-normal); }   /* 포함 */

  /* ═══ PRICING OPTIONS (연간 / 월간) ═══ */
  .opts{
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
    margin:18px 16px 0;
  }
  .opt{
    position:relative; text-align:left;
    padding:18px 16px 16px; border-radius:16px;
    background:linear-gradient(160deg, rgba(112,115,124,0.10), rgba(112,115,124,0.03));
    border:1.5px solid var(--line-solid-neutral);
    cursor:pointer; transition:border-color 0.18s ease, background 0.18s ease, transform 0.1s ease;
    display:flex; flex-direction:column; gap:6px;
  }
  .opt:active{ transform:scale(0.985); }
  .opt.selected{
    border-color:var(--primary-normal);
    background:
      radial-gradient(ellipse 160px 120px at 50% 0%, rgba(var(--primary-rgb),0.14) 0%, transparent 70%),
      linear-gradient(160deg, rgba(var(--primary-rgb),0.08), rgba(var(--primary-rgb),0.02));
    box-shadow:0 0 0 3px rgba(var(--primary-rgb),0.12);
  }
  .opt-ribbon{
    position:absolute; top:-9px; left:14px;
    display:inline-flex; align-items:center; gap:3px;
    padding:3px 9px; border-radius:999px;
    font-size:10px; font-weight:800; letter-spacing:0.01em; color:#fff;
    background:linear-gradient(135deg, var(--accent-red-orange), var(--status-negative));
    box-shadow:0 3px 10px rgba(255,99,99,0.35);
  }
  .opt-period{ font-size:14px; font-weight:700; color:var(--label-strong); }
  .opt-priceline{ display:flex; align-items:baseline; gap:6px; }
  .opt-price{ font-size:24px; font-weight:900; letter-spacing:-0.03em; color:var(--label-strong); }
  .opt-price small{ font-size:13px; font-weight:600; color:var(--label-neutral); }
  .opt-orig{ font-size:12px; font-weight:600; color:var(--label-alternative); text-decoration:line-through; }
  .opt-orig.hide{ visibility:hidden; }
  .opt-tick{
    position:absolute; top:14px; right:14px;
    width:20px; height:20px; border-radius:50%;
    border:1.5px solid var(--line-solid-normal);
    display:flex; align-items:center; justify-content:center;
    color:transparent; transition:all 0.15s ease;
  }
  .opt.selected .opt-tick{ background:var(--primary-normal); border-color:var(--primary-normal); color:#fff; }
  .opt-tick svg{ width:12px; height:12px; }

  /* ═══ CTA BAR ═══ */
  .cta-bar{
    position:fixed; left:0; right:0; bottom:0; z-index:120;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    background:rgba(var(--bg-rgb),0.94);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    border-top:1px solid var(--line-alternative);
  }
  /* 위쪽 콘텐츠가 바 안으로 부드럽게 페이드 */
  .cta-bar::before{
    content:''; position:absolute; left:0; right:0; top:-24px; height:24px;
    background:linear-gradient(180deg, rgba(var(--bg-rgb),0), rgba(var(--bg-rgb),0.94));
    pointer-events:none;
  }
  .cta-inner{ max-width:600px; margin:0 auto; }
  .cta{
    width:100%; height:48px; border-radius:12px;
    background:linear-gradient(116deg, var(--primary-normal), var(--primary-heavy));
    color:var(--label-strong);
    font-size:16px; font-weight:600; letter-spacing:-0.02em;
    box-shadow:0 8px 24px rgba(var(--primary-rgb),0.32);
    transition:transform 0.12s ease, filter 0.15s ease;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .cta:hover{ filter:brightness(1.04); }
  .cta:active{ transform:scale(0.985); }
  .cta-note{ margin-top:8px; text-align:center; font-size:11px; font-weight:500; color:var(--label-alternative); }

  /* ═══ TOAST ═══ */
  .toast{
    position:fixed; top:-60px; left:50%; transform:translateX(-50%);
    padding:12px 24px; border-radius:999px;
    background:rgba(var(--bg-rgb),0.75);
    backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
    color:var(--label-strong); font-size:14px; font-weight:700;
    white-space:nowrap; z-index:9999;
    transition:top 0.4s cubic-bezier(0.34,1.56,0.64,1);
  }
  .toast.show{ top:64px; }

  /* ═══ ENTRANCE ═══ */
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(16px);} to{ opacity:1; transform:translateY(0);} }
  .ai{ animation:fadeUp 0.45s ease-out both; }
  .d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.19s}.d4{animation-delay:.26s}

  /* ═══ DESKTOP (≥769px) ═══ */
  @media (min-width:769px){
    .frame{ max-width:560px; padding-bottom:56px; padding-top:8px; }
    .hero{ min-height:208px; border-radius:0 0 24px 24px; }
    .hero-title{ font-size:36px; } .hero-title .num{ font-size:48px; }
    .hero-sub{ font-size:14px; max-width:380px; }
    .plan{ margin:14px 0 0; padding:26px 24px 22px; }
    .opts{ margin:18px 0 0; }

    /* CTA: 데스크탑은 흐름 안에서 인라인 */
    .cta-bar{
      position:static; padding:0; margin:22px 0 0;
      background:none; backdrop-filter:none; -webkit-backdrop-filter:none; border-top:none;
    }
    .cta-bar::before{ display:none; }
    .cta-inner{ max-width:none; }
  }
</style>
</head>
<body>

<script>
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);

  /* ── 입자 ── */
  (function(){
    const pc = document.getElementById('pts');
    const colors = ['20,195,145','95,255,207','40,208,237'];
    for (let i = 0; i < 14; i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const s = Math.random() * 3 + 2;
      const c = colors[Math.floor(Math.random()*colors.length)];
      p.style.cssText = `width:${s}px;height:${s}px;left:${Math.random()*100}%;`
        + `background:rgba(${c},0.7);box-shadow:0 0 ${s*3}px rgba(${c},0.4);`
        + `animation-duration:${Math.random()*10+10}s;animation-delay:${Math.random()*8}s`;
      pc.appendChild(p);
    }
  })();

  /* ── 결제 주기 선택 ── */
  const PLAN = {
    annual:  { cta:'월 $30 구독하기', note:'매월 자동 갱신 · 언제든 취소 가능' },
    monthly: { cta:'월 $39.99 구독하기', note:'매월 자동 갱신 · 언제든 취소 가능' }
  };
  let current = 'annual';

  function selectPlan(period){
    current = period;
    document.querySelectorAll('.opt').forEach(o => {
      o.classList.toggle('selected', o.dataset.period === period);
    });
    document.getElementById('ctaBtn').textContent = PLAN[period].cta;
    document.getElementById('ctaNote').textContent = PLAN[period].note;
  }

  function subscribe(){
    const label = current === 'annual' ? '연간 (연 $360)' : '월간 (월 $39.99)';
    showToast(`MAX ${label} 구독 — 결제 연동 예정`);
  }

  /* ── 토스트 ── */
  function showToast(msg){
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('show')));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2500);
  }
</script>
</body>
</html>
